# Canonical system-level contract values. Module-specific loaders should derive
# their dataclasses from this file rather than redefining physical limits.
geometry:
  bev_x_range: [-12.5, 12.5]
  bev_y_range: [-12.5, 12.5]
  bev_resolution: 0.5
  bev_channels: 32
sensors:
  num_cameras: 3
  image_size: [192, 192]
  num_points: 256
  imu_steps: 10
  imu_channels: 6
  calibration_version: carla-default-v1
sensor_health:
  max_sensor_age_seconds: 0.2
  max_sensor_skew_seconds: 0.05
  black_pixel_threshold: 2
  saturation_pixel_threshold: 253
  max_black_ratio: 0.98
  max_saturation_ratio: 0.98
  max_consecutive_identical_frames: 2
  min_lidar_points: 16
  min_lidar_valid_ratio: 0.8
  max_lidar_abs_coordinate: 100.0
  max_lidar_duplicate_ratio: 0.98
  max_accel_abs: 50.0
  max_gyro_abs: 5.0
  max_accel_step_delta: 20.0
  max_gyro_step_delta: 2.0
  max_imu_sample_gap_seconds: 0.11
vehicle:
  wheelbase: 2.5
  max_steering: 0.5
  max_steering_rate: 0.5
  max_speed: 20.0
  max_accel: 3.0
  max_decel: -5.0
  max_lateral_accel: 4.0
control:
  dt: 0.1
runtime:
  policy_frame: ego
  # lidar is the validated baseline; learned/fused require a trained
  # perception checkpoint and occupancy quality evidence.
  occupancy_source: lidar
carla_baseline:
  version: 0.9.16
  map_name: Town10HD_Opt
  vehicle_blueprint: vehicle.lincoln.mkz_2020
  random_seed: 42
  repetitions: 3
  cameras:
    - name: front
      blueprint: sensor.camera.rgb
      location_m: [1.5, 0.0, 1.6]
      rotation_degrees: [0.0, 0.0, 0.0]
      fov_degrees: 90.0
      sensor_tick_seconds: 0.1
    - name: rear
      blueprint: sensor.camera.rgb
      location_m: [-1.5, 0.0, 1.6]
      rotation_degrees: [0.0, 0.0, 180.0]
      fov_degrees: 90.0
      sensor_tick_seconds: 0.1
    - name: top
      blueprint: sensor.camera.rgb
      location_m: [0.0, 0.0, 1.9]
      rotation_degrees: [0.0, -15.0, 0.0]
      fov_degrees: 100.0
      sensor_tick_seconds: 0.1
  lidar:
    blueprint: sensor.lidar.ray_cast
    location_m: [0.0, 0.0, 1.9]
    rotation_degrees: [0.0, 0.0, 0.0]
    channels: 32
    range_meters: 50.0
    points_per_second: 320000
    rotation_frequency_hz: 10.0
    upper_fov_degrees: 15.0
    lower_fov_degrees: -25.0
    sensor_tick_seconds: 0.1
    canonical_points: 256
    canonical_y_flip: true
  imu:
    blueprint: sensor.other.imu
    location_m: [0.0, 0.0, 0.5]
    rotation_degrees: [0.0, 0.0, 0.0]
    sensor_tick_seconds: 0.1
    history_steps: 10
    channels: 6
domain_randomization:
  tire_friction: [0.4, 1.4]
  vehicle_mass: [1500.0, 1900.0]
  lidar_sigma: [0.0, 0.1]
  lidar_dropout: [0.0, 0.05]
  suspension_damping: [400.0, 1200.0]
affordance:
  enabled: false
  hidden_channels: 32
  traversability_weight: 1.0
  roughness_weight: 1.0
  speed_epsilon: 0.5
policy_training:
  imagination_horizon: 5
  bc_xy_weight: 1.0
  bc_heading_weight: 0.2
  bc_speed_weight: 0.2
  bc_smooth_weight: 0.05
